openapi: 3.1.0
info:
  title: 宜租网 AI 找房 BFF API
  version: 0.2.0
  description: >-
    本地演示垂直切片；API/Rust 金额均为整数分，用户界面仅显示元。
    业务日期按 Asia/Shanghai 解释；不代表生产数据持久化或真实顾问通知。
servers:
  - url: http://127.0.0.1:8080/api/miniapp/v1
    description: 本地 Dioxus BFF
paths:
  /auth/dev-session:
    post:
      operationId: createDevSession
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DevSessionRequest' }
      responses:
        '200':
          description: 统一业务响应
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/ApiResponse' }
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/DevSessionResponse' }
  /demands/interpret:
    post:
      operationId: interpretDemand
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InterpretDemandRequest' }
      responses:
        '200':
          description: 统一业务响应
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/ApiResponse' }
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/DemandInterpretation' }
  /matches:
    post:
      operationId: createMatches
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MatchRequest' }
      responses:
        '200':
          description: 统一业务响应
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/ApiResponse' }
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/MatchResponse' }
  /leads:
    post:
      operationId: submitLead
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubmitLeadRequest' }
      responses:
        '200':
          description: 统一业务响应
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/ApiResponse' }
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/LeadRecord' }
  /metadata/options:
    get:
      operationId: loadMetadata
      responses:
        '200':
          description: 统一业务响应
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/ApiResponse' }
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/MetadataOptions' }
components:
  schemas:
    ApiFieldError:
      type: object
      required: [field, message]
      properties:
        field: { type: string }
        message: { type: string }
    ApiResponse:
      type: object
      required: [code, message, request_id, data, errors]
      properties:
        code: { type: string }
        message: { type: string }
        request_id: { type: string }
        data: { type: [object, 'null'] }
        errors:
          type: array
          items: { $ref: '#/components/schemas/ApiFieldError' }
    SpaceType:
      type: string
      enum: [factory, warehouse, office]
    RentUnit:
      type: string
      enum: [yuan_per_month, yuan_per_square_metre_month]
    ConstraintKey:
      type: string
      enum: [budget, freight_elevator, elevator_capacity, power_capacity, fire_safety, truck_access, loading_dock, sublease, floor, move_in]
    ConstraintLevel:
      type: string
      enum: [hard, preference]
    ConstraintPriority:
      type: object
      additionalProperties: false
      required: [key, level]
      properties:
        key: { $ref: '#/components/schemas/ConstraintKey' }
        level: { $ref: '#/components/schemas/ConstraintLevel' }
    DemandConstraints:
      type: object
      required:
        - space_type
        - target_towns
        - area_min_sqm
        - area_max_sqm
        - rent_min_cents
        - rent_max_cents
        - rent_unit
        - move_in_time
        - floor_preference
        - needs_freight_elevator
        - elevator_min_tons
        - power_capacity_kva
        - fire_requirement
        - logistics_requirement
        - loading_requirement
        - accepts_sublease
        - other_notes
      properties:
        space_type:
          oneOf: [{ $ref: '#/components/schemas/SpaceType' }, { type: 'null' }]
        target_towns:
          type: array
          maxItems: 8
          items: { type: string }
        area_min_sqm: { type: [integer, 'null'], minimum: 1 }
        area_max_sqm: { type: [integer, 'null'], minimum: 1 }
        rent_min_cents: { type: [integer, 'null'], minimum: 0, maximum: 10000000000, description: API存储单位为整数分；UI输入和展示单位为元。 }
        rent_max_cents: { type: [integer, 'null'], minimum: 0, maximum: 10000000000, description: API存储单位为整数分；UI输入和展示单位为元。 }
        rent_unit:
          oneOf: [{ $ref: '#/components/schemas/RentUnit' }, { type: 'null' }]
        move_in_time:
          type: [string, 'null']
          description: immediate 截止中国标准时间参考日；within_30_days/within_90_days 截止参考日加30/90个日历日；也可用严格 YYYY-MM-DD。
        floor_preference: { type: [string, 'null'] }
        needs_freight_elevator: { type: [boolean, 'null'] }
        elevator_min_tons: { type: [number, 'null'], minimum: 0.1, maximum: 100 }
        power_capacity_kva: { type: [integer, 'null'], minimum: 1, maximum: 100000 }
        fire_requirement: { type: [string, 'null'] }
        logistics_requirement: { type: [string, 'null'] }
        loading_requirement: { type: [string, 'null'] }
        accepts_sublease: { type: [boolean, 'null'] }
        other_notes: { type: [string, 'null'] }
    DemandDraft:
      type: object
      required: [raw_text, constraints, hard_conditions, preference_conditions, constraint_priorities, missing_fields, ai_confidence]
      properties:
        raw_text: { type: string, minLength: 1, maxLength: 1000 }
        constraints: { $ref: '#/components/schemas/DemandConstraints' }
        hard_conditions:
          type: array
          maxItems: 20
          items: { type: string }
        preference_conditions:
          type: array
          maxItems: 20
          items: { type: string }
        constraint_priorities:
          type: array
          maxItems: 10
          uniqueItems: true
          description: 支持字段的类型化 hard/preference 级别；未知其他硬条件仍放在 hard_conditions 并视为无法验证。
          items: { $ref: '#/components/schemas/ConstraintPriority' }
        missing_fields:
          type: array
          items: { type: string }
        ai_confidence: { type: number, minimum: 0, maximum: 1 }
    DemandInterpretation:
      type: object
      required: [demand, provider, fallback_reason]
      properties:
        demand: { $ref: '#/components/schemas/DemandDraft' }
        provider: { type: string, enum: [local, bailian] }
        fallback_reason: { type: [string, 'null'] }
    ListingVerificationLevel:
      type: string
      enum: [l0, l1, l2, l3]
    ListingSummary:
      type: object
      required:
        - listing_id
        - listing_name
        - space_type
        - town
        - available_area_sqm
        - rent_cents_per_sqm_month
        - monthly_rent_cents
        - verification_level
        - is_self_operated
        - source_label
        - updated_at
        - available_from
        - rental_status
        - power_capacity_kva
        - has_freight_elevator
        - elevator_capacity_tons
        - fire_rating
        - truck_access
        - loading_dock
        - allows_sublease
        - floor_label
        - data_gaps
      properties:
        listing_id: { type: string }
        listing_name: { type: string }
        space_type: { $ref: '#/components/schemas/SpaceType' }
        town: { type: string }
        available_area_sqm: { type: integer }
        rent_cents_per_sqm_month: { type: integer }
        monthly_rent_cents: { type: integer }
        verification_level: { $ref: '#/components/schemas/ListingVerificationLevel' }
        is_self_operated: { type: boolean }
        source_label: { type: string }
        updated_at: { type: string }
        available_from: { type: string }
        rental_status: { type: string }
        power_capacity_kva: { type: [integer, 'null'] }
        has_freight_elevator: { type: [boolean, 'null'] }
        elevator_capacity_tons: { type: [number, 'null'] }
        fire_rating: { type: [string, 'null'] }
        truck_access: { type: [boolean, 'null'] }
        loading_dock: { type: [boolean, 'null'] }
        allows_sublease: { type: [boolean, 'null'] }
        floor_label: { type: [string, 'null'] }
        data_gaps:
          type: array
          items: { type: string }
    MatchDimensionScore:
      type: object
      required: [dimension, score, weight, reason]
      properties:
        dimension: { type: string, enum: [location, space, cost, production, logistics, compliance, move_in] }
        score: { type: number, minimum: 0, maximum: 100 }
        weight: { type: number, minimum: 0, maximum: 1 }
        reason: { type: string }
    MatchResult:
      type: object
      required: [listing, overall_score, dimension_scores, recommendation_reasons, unmet_conditions, satisfied_hard_constraints, unmet_hard_constraints, unverified_hard_constraints, unmet_preferences, area_relaxed, data_gaps]
      properties:
        listing: { $ref: '#/components/schemas/ListingSummary' }
        overall_score: { type: number, minimum: 0, maximum: 100 }
        dimension_scores:
          type: array
          minItems: 7
          maxItems: 7
          items: { $ref: '#/components/schemas/MatchDimensionScore' }
        recommendation_reasons:
          type: array
          minItems: 3
          maxItems: 3
          items: { type: string }
        unmet_conditions:
          type: array
          items: { type: string }
        satisfied_hard_constraints:
          type: array
          items: { $ref: '#/components/schemas/ConstraintAssessment' }
        unmet_hard_constraints:
          type: array
          description: 非空时 /leads 返回 HARD_CONDITION_NOT_MET。
          items: { $ref: '#/components/schemas/ConstraintAssessment' }
        unverified_hard_constraints:
          type: array
          description: 非空时 /leads 返回 HARD_CONDITION_UNVERIFIED。
          items: { $ref: '#/components/schemas/ConstraintAssessment' }
        unmet_preferences:
          type: array
          description: 偏好不阻断线索，但客户端明确展示。
          items: { $ref: '#/components/schemas/ConstraintAssessment' }
        area_relaxed: { type: boolean }
        data_gaps:
          type: array
          items: { type: string }
    ConstraintAssessment:
      type: object
      additionalProperties: false
      required: [key, label, detail]
      properties:
        key:
          oneOf: [{ $ref: '#/components/schemas/ConstraintKey' }, { type: 'null' }]
        label: { type: string }
        detail: { type: string }
    MatchResponse:
      type: object
      required: [matches, used_area_relaxation, next_step_suggestion, demo_data]
      properties:
        matches:
          type: array
          maxItems: 10
          items: { $ref: '#/components/schemas/MatchResult' }
        used_area_relaxation: { type: boolean }
        next_step_suggestion: { type: [string, 'null'] }
        demo_data: { type: boolean, const: true }
    DevSessionRequest:
      type: object
      required: [phone, contact_confirmed]
      properties:
        phone: { type: string, pattern: '^1[3-9][0-9]{9}$' }
        contact_confirmed: { type: boolean }
    DevSessionResponse:
      type: object
      required: [session_token, masked_phone, expires_at_epoch_seconds, local_demo]
      properties:
        session_token: { type: string }
        masked_phone: { type: string }
        expires_at_epoch_seconds: { type: integer }
        local_demo: { type: boolean, const: true }
    InterpretDemandRequest:
      type: object
      required: [session_token, draft]
      properties:
        session_token: { type: string }
        draft: { $ref: '#/components/schemas/DemandDraft' }
    MatchRequest:
      type: object
      required: [session_token, demand]
      properties:
        session_token: { type: string }
        demand: { $ref: '#/components/schemas/DemandDraft' }
    LeadSubmission:
      type: object
      required: [demand, recommended_listing_ids, source_channel, idempotency_key]
      properties:
        demand: { $ref: '#/components/schemas/DemandDraft' }
        recommended_listing_ids:
          type: array
          minItems: 1
          maxItems: 10
          items: { type: string }
        source_channel: { type: string, const: miniapp_ai_demand }
        idempotency_key: { type: string, minLength: 16, maxLength: 128, pattern: '^[A-Za-z0-9_-]+$' }
    SubmitLeadRequest:
      type: object
      required: [session_token, submission]
      properties:
        session_token: { type: string }
        submission: { $ref: '#/components/schemas/LeadSubmission' }
    LeadRecord:
      type: object
      required: [demand_number, lead_number, demand_snapshot, recommended_listing_ids, source_channel, status, sla_minutes, created_at_epoch_seconds, temporary_storage]
      properties:
        demand_number: { type: string }
        lead_number: { type: string }
        demand_snapshot: { $ref: '#/components/schemas/DemandDraft' }
        recommended_listing_ids:
          type: array
          items: { type: string }
        source_channel: { type: string }
        status: { type: string, const: pending_assignment }
        sla_minutes: { type: integer, const: 15 }
        created_at_epoch_seconds: { type: integer }
        temporary_storage: { type: boolean, const: true }
    MetadataOptions:
      type: object
      required: [towns, space_types, rent_units, verification_levels, constraint_keys, business_timezone, currency_storage_unit, currency_display_unit, demo_data]
      properties:
        towns:
          type: array
          minItems: 33
          maxItems: 33
          uniqueItems: true
          items: { type: string }
        space_types:
          type: array
          items: { $ref: '#/components/schemas/SpaceType' }
        rent_units:
          type: array
          items: { $ref: '#/components/schemas/RentUnit' }
        verification_levels:
          type: array
          items: { $ref: '#/components/schemas/ListingVerificationLevel' }
        constraint_keys:
          type: array
          items: { $ref: '#/components/schemas/ConstraintKey' }
        business_timezone: { type: string, const: Asia/Shanghai }
        currency_storage_unit: { type: string, const: cents }
        currency_display_unit: { type: string, const: yuan }
        demo_data: { type: boolean, const: true }
