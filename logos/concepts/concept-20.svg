<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- 概念二十：小篆「云」朱砂方印 + 四角云纹 -->
  <!-- 传统色：朱砂 #9c3a2b / 宣白 #f2ece0 -->
  <defs>
    <clipPath id="plateClip">
      <rect x="48" y="48" width="416" height="416" rx="10"/>
    </clipPath>
    <g id="corner-cloud">
      <g fill="#f2ece0">
        <path d="M0 0H240L0 240Z"/>
        <circle cx="176" cy="64" r="52"/>
        <circle cx="112" cy="128" r="44"/>
        <circle cx="56" cy="184" r="34"/>
      </g>
      <g fill="none" stroke="#9c3a2b" stroke-width="17" stroke-linecap="round">
        <g transform="translate(176 64) rotate(135)"><path d="M-32 0c0-19.2 16-32 32-32 17.6 0 23 17.6 16 32-2.6 11.2-12.8 16-18.6 9"/></g>
        <g transform="translate(112 128) rotate(135)"><path d="M-26 0c0-15.6 13-26 26-26 14.3 0 18.7 14.3 13 26-2.1 9.1-10.4 13-15 7.3"/></g>
        <g transform="translate(56 184) rotate(135)"><path d="M-20 0c0-12 10-20 20-20 11 0 14.4 11 10 20-1.6 7-8 10-11.6 5.6"/></g>
      </g>
    </g>
  </defs>

  <g id="icon" clip-path="url(#plateClip)">
    <rect id="plate" x="48" y="48" width="416" height="416" rx="10" fill="#9c3a2b"/>
    <use href="#corner-cloud" transform="translate(48 48) scale(0.44)"/>
    <use href="#corner-cloud" transform="translate(464 48) scale(-0.44 0.44)"/>
    <use href="#corner-cloud" transform="translate(464 464) scale(-0.44)"/>
    <use href="#corner-cloud" transform="translate(48 464) scale(0.44 -0.44)"/>
    <g id="glyph-yun" transform="translate(256 252) scale(0.85) translate(-256 -270)"
       fill="none" stroke="#f2ece0" stroke-width="22"
       stroke-linecap="round" stroke-linejoin="round">
      <path id="heng-1" d="M148 140H364"/>
      <path id="heng-2" d="M176 200H336"/>
      <path id="huizhuan" d="M196 258c-18 106 44 176 120 138 46-23 44-82 2-100-30-13-58 6-54 36 3 21 24 29 38 16"/>
    </g>
  </g>
</svg>
