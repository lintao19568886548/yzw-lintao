    <g fill="none" stroke="#c19a4f" stroke-linecap="round" stroke-linejoin="round">
      <rect id="wei" x="112" y="104" width="288" height="312" rx="34" stroke-width="28"/>
      <g id="glyph-yun" stroke-width="28">
        <path id="heng-1" d="M172 186Q256 174 340 186"/>
        <path id="heng-2" d="M194 240Q256 230 318 240"/>
        <path id="huizhuan" d="M204 288c-6 56 48 87 92 61 30-18 21-53-9-44"/>
      </g>
    </g>
