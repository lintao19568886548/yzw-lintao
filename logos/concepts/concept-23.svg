<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- 概念二十三：小篆「云」朱砂方印 + 四角云纹（两瓣加大版，笔画更壮，小尺寸更稳） -->
  <!-- 传统色：朱砂 #9c3a2b / 宣白 #f2ece0 -->
  <defs>
    <clipPath id="plateClip">
      <rect x="48" y="48" width="416" height="416" rx="10"/>
    </clipPath>
    <g id="corner-cloud">
      <g fill="#f2ece0">
        <path d="M0 0H240L0 240Z"/>
        <circle cx="168" cy="72" r="60"/>
        <circle cx="82" cy="158" r="46"/>
      </g>
      <g fill="none" stroke="#9c3a2b" stroke-width="19" stroke-linecap="round">
        <g transform="translate(168 72) rotate(135)"><path d="M-38 0c0-22.8 19-38 38-38 20.9 0 27.3 20.9 19 38-3.1 13.3-15.2 19-22.1 10.6"/></g>
        <g transform="translate(82 158) rotate(135)"><path d="M-28 0c0-16.8 14-28 28-28 15.4 0 20.2 15.4 14 28-2.3 9.8-11.2 14-16.3 7.8"/></g>
      </g>
    </g>
  </defs>

  <g id="icon" clip-path="url(#plateClip)">
    <rect id="plate" x="48" y="48" width="416" height="416" rx="10" fill="#9c3a2b"/>
    <use href="#corner-cloud" transform="translate(48 48) scale(0.46)"/>
    <use href="#corner-cloud" transform="translate(464 48) scale(-0.46 0.46)"/>
    <use href="#corner-cloud" transform="translate(464 464) scale(-0.46)"/>
    <use href="#corner-cloud" transform="translate(48 464) scale(0.46 -0.46)"/>
    <g id="glyph-yun" transform="translate(256 252) scale(0.85) translate(-256 -270)"
       fill="none" stroke="#f2ece0" stroke-width="24"
       stroke-linecap="round" stroke-linejoin="round">
      <path id="heng-1" d="M148 140H364"/>
      <path id="heng-2" d="M176 200H336"/>
      <path id="huizhuan" d="M196 258c-18 106 44 176 120 138 46-23 44-82 2-100-30-13-58 6-54 36 3 21 24 29 38 16"/>
    </g>
  </g>
</svg>
