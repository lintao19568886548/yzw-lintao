map $http_upgrade $yizu_connection_upgrade {
  default upgrade;
  ''      close;
}

# HY2 masquerade upstream. This listener is local-only.
server {
  listen 127.0.0.1:8080;
  server_name _;

  location / {
    proxy_pass http://127.0.0.1:8081;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $yizu_connection_upgrade;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

server {
  listen 80;
  listen [::]:80;
  server_name yz.furong.org;
  return 301 https://$host$request_uri;
}

# Dioxus: https://yz.furong.org
server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name yz.furong.org;

  ssl_certificate /var/lib/hysteria/acme/certificates/acme-v02.api.letsencrypt.org-directory/yz.furong.org/yz.furong.org.crt;
  ssl_certificate_key /var/lib/hysteria/acme/certificates/acme-v02.api.letsencrypt.org-directory/yz.furong.org/yz.furong.org.key;
  ssl_protocols TLSv1.2 TLSv1.3;

  # SpacetimeDB API and WebSocket endpoint through Cloudflare HTTPS.
  location ^~ /v1/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    # 模块发布走 /v1/database/<name>/publish，wasm 有几 MB。不写这一条会继承
    # nginx 默认的 1m，spacetime publish 在 pre_publish 阶段就被截断，报
    # 「Broken pipe」——看起来像网络抖动，实际是被代理挡掉的。
    # 1314 端口那个 server 块本来有 64m，但该端口对外不通，指望不上。
    client_max_body_size 64m;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $yizu_connection_upgrade;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_buffering off;
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
  }

  location / {
    proxy_pass http://127.0.0.1:8081;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $yizu_connection_upgrade;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 300s;
  }
}

# SpacetimeDB: https://yz.furong.org:1314
server {
  listen 1314 ssl;
  listen [::]:1314 ssl;
  server_name yz.furong.org;

  ssl_certificate /var/lib/hysteria/acme/certificates/acme-v02.api.letsencrypt.org-directory/yz.furong.org/yz.furong.org.crt;
  ssl_certificate_key /var/lib/hysteria/acme/certificates/acme-v02.api.letsencrypt.org-directory/yz.furong.org/yz.furong.org.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  client_max_body_size 64m;

  location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $yizu_connection_upgrade;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_buffering off;
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
  }
}
