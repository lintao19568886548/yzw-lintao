map $http_upgrade $yizu_connection_upgrade {
  default upgrade;
  ''      close;
}

# 公网代理永久拒绝模块发布和数据库删除。固定的生产模块发布只允许部署脚本通过
# 服务器本机地址执行；任何域名或公开监听端口命中这些路径都直接返回拒绝。
map "$request_method:$uri" $yizu_block_destructive_spacetime_operation {
  default 0;
  "~^DELETE:/v1/database/" 1;
  "~^[A-Z]+:/v1/database/[^/]+/publish(?:/|$)" 1;
}

# HY2 masquerade upstream. This listener is local-only.
server {
  listen 127.0.0.1:8080;
  server_name _;

  location / {
    proxy_pass http://127.0.0.1:8081;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $yizu_connection_upgrade;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

server {
  listen 80;
  listen [::]:80;
  server_name yz.furong.org;
  return 301 https://$host$request_uri;
}

# Dioxus: https://yz.furong.org
server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name yz.furong.org;

  ssl_certificate /var/lib/hysteria/acme/certificates/acme-v02.api.letsencrypt.org-directory/yz.furong.org/yz.furong.org.crt;
  ssl_certificate_key /var/lib/hysteria/acme/certificates/acme-v02.api.letsencrypt.org-directory/yz.furong.org/yz.furong.org.key;
  ssl_protocols TLSv1.2 TLSv1.3;

  # SpacetimeDB API and WebSocket endpoint through Cloudflare HTTPS.
  location ^~ /v1/ {
    if ($yizu_block_destructive_spacetime_operation) { return 403; }
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    client_max_body_size 64m;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $yizu_connection_upgrade;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_buffering off;
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
  }

  location / {
    proxy_pass http://127.0.0.1:8081;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $yizu_connection_upgrade;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 300s;
  }
}

# SpacetimeDB: https://yz.furong.org:1314
server {
  listen 1314 ssl;
  listen [::]:1314 ssl;
  server_name yz.furong.org;

  ssl_certificate /var/lib/hysteria/acme/certificates/acme-v02.api.letsencrypt.org-directory/yz.furong.org/yz.furong.org.crt;
  ssl_certificate_key /var/lib/hysteria/acme/certificates/acme-v02.api.letsencrypt.org-directory/yz.furong.org/yz.furong.org.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  client_max_body_size 64m;

  location / {
    if ($yizu_block_destructive_spacetime_operation) { return 403; }
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $yizu_connection_upgrade;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_buffering off;
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
  }
}
